<input
  type="range"
  [min]="min()"
  [max]="max()"
  [step]="step()"
  [value]="value()"
  [disabled]="disabled()"
  (pointerdown)="dragStarted.emit()"
  (pointerup)="commit($event)"
  (pointercancel)="commit($event)"
  (change)="commit($event)"
  (input)="changed($event)"
  [appHighlightSliderValue]="value()"
  [appHighlightSliderColorLeft]="colorLeft()"
  [appHighlightSliderColorRight]="colorRight()"
  class="slider"
  appHighlightSlider
/>
