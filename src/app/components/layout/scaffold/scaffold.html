<div class="w-full h-screen flex flex-col min-w-202.5">
  <!-- * Top Bar (visual-only chrome) -->
  <app-top-bar></app-top-bar>
  <main class="w-full! grow flex flex-col p-2 gap-2 overflow-hidden min-h-0">
    <div class="w-full! grow flex gap-2 overflow-hidden min-h-0">
      <!-- * Library Section (open list or icon rail; shell arbitrates) -->
      <aside class="shrink-0">
        <app-library-section
          [open]="libraryOpen()"
          (openChange)="setLibraryOpen($event)"
        ></app-library-section>
      </aside>

      <!-- * Main Content Section (official: the center never shrinks) -->
      <section
        class="grow rounded-2xl bg-(--secondary) overflow-y-auto min-w-100"
      >
        <router-outlet></router-outlet>
      </section>

      <!-- * Now Playing Section (open panel or collapsed sliver, inside component) -->
      <aside class="shrink-0" [class]="nowPlayingOpen() ? 'w-80' : 'w-11'">
        <app-now-playing-section
          [open]="nowPlayingOpen()"
          (openChange)="setNowPlayingOpen($event)"
        />
      </aside>
    </div>

    <!-- * Reproduction Controllers Section -->
    <section class="w-full h-20 shrink-0">
      <app-reproduction-controller></app-reproduction-controller>
    </section>
  </main>

  <!-- * Playback feedback toasts (error/buffering) -->
  <app-playback-feedback></app-playback-feedback>

  <!-- * Keyboard shortcuts overlay (? / Esc) -->
  <app-shortcuts-overlay></app-shortcuts-overlay>
</div>
