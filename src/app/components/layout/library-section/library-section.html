<section
  class="flex flex-col w-full h-full rounded-2xl bg-(--secondary) p-3 overflow-y-auto transition-all!"
  [ngClass]="{ 'w-80': open() }"
>
  <!-- * Library Header -->
  <section
    (click)="toggleOpen()"
    class="flex items-center justify-start w-full h-10 shadow ps-2 cursor-pointer"
    [ngClass]="{ 'justify-center! ps-0!': !open() }"
  >
    <i class="text-white pi pi-bars"></i>

    @if (open()) {
      <p class="font-bold ms-2 text-white">Your library</p>
    }
  </section>

  <!-- * Library Searcher -->
  @if (open()) {
    <section class="w-fit p-2">
      <app-search-button
        placeholder="Search in your library"
        (searchText)="textSearch.set($event)"
      ></app-search-button>
    </section>
  }

  <!-- * Library Content -->
  <section class="w-full flex flex-col justify-start align-middle">
    @for (playlist of filteredPlaylists(); track $index) {
      <app-source-card
        [source]="playlist"
        [variant]="open() ? 'with-description' : 'only-img'"
      ></app-source-card>
    } @empty {
      <!-- * No matching playlists (search empty state) -->
      <p class="text-(--muted) text-sm px-2 py-4 m-0">
        Couldn't find "{{ textSearch().trim() }}"
      </p>
    }
  </section>
</section>
