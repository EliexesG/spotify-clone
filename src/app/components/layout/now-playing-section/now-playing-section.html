<section
  class="flex flex-col w-full h-full rounded-2xl bg-(--secondary) p-3 overflow-y-auto transition-all!"
>
  <!-- * Panel header (current playlist / queue name) -->
  <header class="flex items-center justify-between h-10 ps-2 shrink-0">
    <p class="font-bold m-0 truncate">{{ header() }}</p>
    <i class="pi pi-times cursor-pointer text-(--muted) hover:text-white"></i>
  </header>

  @if (track(); as t) {
    <!-- * Current track: big cover (shared component) + title + artist -->
    <div class="relative w-full aspect-square rounded-md overflow-hidden mt-2">
      <app-image-fallback [src]="img()" alt="Current track cover" />
    </div>
    <p class="font-bold mt-4 mb-1 wrap-break-word">{{ t.title }}</p>
    <p class="text-(--muted) m-0">{{ t.artist }}</p>
  } @else {
    <!-- * Nothing loaded: empty state (official "Find something to play") -->
    <div
      class="flex-1 flex flex-col items-center justify-center gap-3 text-(--muted)"
    >
      <i class="pi pi-headphones text-2xl"></i>
      <p class="m-0">Find something to play</p>
    </div>
  }
</section>
