<section class="p-6">
  <h2 class="text-2xl font-bold mb-6">Your library</h2>

  @if (playlists.length === 0) {
    <p class="text-(--muted)">No playlists yet.</p>
  } @else {
    <div class="grid gap-4 [grid-template-columns:repeat(auto-fill,minmax(180px,1fr))]">
      @for (playlist of playlists; track playlist.id) {
        <app-source-card [source]="playlist" variant="big" />
      }
    </div>
  }
</section>
